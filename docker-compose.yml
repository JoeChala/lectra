services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: lectra-backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://lectra:lectra@postgres:5432/lectra
      QDRANT_URL: http://qdrant:6333
    depends_on:
      - postgres
      - qdrant

  postgres:
    image: postgres:16-alpine
    container_name: lectra-postgres
    environment:
      POSTGRES_USER: lectra
      POSTGRES_PASSWORD: lectra
      POSTGRES_DB: lectra
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  qdrant:
    image: qdrant/qdrant:latest
    container_name: lectra-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage

volumes:
  postgres_data:
  qdrant_data: